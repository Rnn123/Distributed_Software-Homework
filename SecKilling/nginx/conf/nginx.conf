worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/html text/css application/javascript application/json text/plain;
    sendfile on;
    keepalive_timeout 65;

    upstream seckill_backend {
        # 默认轮询 Round Robin
        server seckill-app-1:8080 weight=1;
        server seckill-app-2:8080 weight=1;

        # 如果需要切换策略，可改为：
        # least_conn;
        # ip_hash;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location /api/ {
            proxy_pass http://seckill_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
