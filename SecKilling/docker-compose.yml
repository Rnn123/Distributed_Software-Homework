services:
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seckill
    ports:
      - "3308:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./mysql/master/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: seckill-redis
    restart: always
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.2
    container_name: seckill-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: seckill-nacos
    restart: always
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"

  seckill-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seckill-app-1
    restart: on-failure
    environment:
      SPRING_DATASOURCE_WRITE_URL: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_WRITE_USERNAME: root
      SPRING_DATASOURCE_WRITE_PASSWORD: root
      SPRING_DATASOURCE_READ_URL: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_READ_USERNAME: root
      SPRING_DATASOURCE_READ_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NACOS_SERVER_ADDR: nacos:8848
      APP_INSTANCE_ID: app-1
      APP_SNOWFLAKE_MACHINE_ID: 1
      APP_KAFKA_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      nacos:
        condition: service_started

  seckill-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seckill-app-2
    restart: on-failure
    environment:
      SPRING_DATASOURCE_WRITE_URL: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_WRITE_USERNAME: root
      SPRING_DATASOURCE_WRITE_PASSWORD: root
      SPRING_DATASOURCE_READ_URL: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_READ_USERNAME: root
      SPRING_DATASOURCE_READ_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NACOS_SERVER_ADDR: nacos:8848
      APP_INSTANCE_ID: app-2
      APP_SNOWFLAKE_MACHINE_ID: 2
      APP_KAFKA_ENABLED: "true"
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      nacos:
        condition: service_started

  seckill-gateway:
    build:
      context: ./seckill-gateway
      dockerfile: Dockerfile
    container_name: seckill-gateway
    restart: on-failure
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_SECKILL_REPLENISH_RATE: 20
      GATEWAY_SECKILL_BURST_CAPACITY: 40
    ports:
      - "9000:9000"
    depends_on:
      redis:
        condition: service_started
      nacos:
        condition: service_started
      seckill-app-1:
        condition: service_started
      seckill-app-2:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: seckill-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - seckill-app-1
      - seckill-app-2
